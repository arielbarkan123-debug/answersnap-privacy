name: Build Kindergarten Manager (Windows)

on:
  workflow_dispatch:
  push:
    branches: [claude/domain-acquisition-research-keu4tx]
    paths:
      - 'kindergarten-app/**'
      - '.github/workflows/build-kindergarten-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kindergarten-app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kindergarten-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: KindergartenManager-Windows
          path: |
            kindergarten-app/dist/KindergartenManager-Setup-*.exe
            kindergarten-app/dist/KindergartenManager-Portable-*.exe
          if-no-files-found: error
